<VirtualHost *:80>
    ServerName dinghy.tst
    Redirect / https://dinghy.tst/
</VirtualHost>

<VirtualHost *:443>
    ServerName dinghy.tst
    DocumentRoot /var/www/laravel/public

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'"

    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/dinghy.tst.crt
    SSLCertificateKeyFile /etc/apache2/certs/dinghy.tst.key

    <Directory /var/www/laravel/public>
        AllowOverride All
        Require all granted
    </Directory>

    Alias /info.php /var/www/html/index.php

    RewriteEngine On
    RewriteRule ^/phpmyadmin$ /phpmyadmin/ [R=301,L]

    ProxyPreserveHost On
    ProxyPass /phpmyadmin http://phpmyadmin:80
    ProxyPassReverse /phpmyadmin http://phpmyadmin:80
</VirtualHost>
